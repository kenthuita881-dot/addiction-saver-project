<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><title>Admin | Addiction Saver</title>
<style>/* ==========================================================
   Addiction Saver: stylesheet
   Palette: night navy + teal + sunrise amber/coral
   ========================================================== */
:root {
  --navy: #0f1b3d;
  --navy-2: #1b2b5e;
  --indigo: #4338ca;
  --teal: #0ea5a4;
  --teal-d: #0b7f7e;
  --sun: #fbbf24;
  --amber: #f59e0b;
  --coral: #f97362;
  --rose: #ec4899;
  --ink: #14213d;
  --muted: #5b6785;
  --line: #e3e8f5;
  --bg: #f6f8ff;
  --card: #ffffff;
  --radius: 20px;
  --shadow: 0 10px 30px rgba(15, 27, 61, .08);
  --shadow-lg: 0 24px 60px rgba(15, 27, 61, .18);
  --grad-sun: linear-gradient(135deg, #fbbf24 0%, #f97362 100%);
  --grad-night: linear-gradient(135deg, #0f1b3d 0%, #312e81 55%, #0e7490 100%);
  --grad-teal: linear-gradient(135deg, #0ea5a4 0%, #3b82f6 100%);
  --font-head: "Playfair Display", Georgia, serif;
  --font-body: "Poppins", "Segoe UI", Tahoma, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body {
  font-family: var(--font-body); color: var(--ink); background: var(--bg);
  line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img, svg { display: block; max-width: 100%; }
a { color: var(--indigo); }
ul, ol { list-style: none; }
button { font-family: inherit; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.wrap { width: min(1180px, 100% - 48px); margin-inline: auto; }
.wrap.narrow { width: min(820px, 100% - 48px); }

/* ===== scroll progress & crisis bar ===== */
.scroll-progress { position: fixed; top: 0; left: 0; height: 4px; width: 0; z-index: 3000; background: var(--grad-sun); }
.crisis-bar { background: #fff7e6; color: #7c4a03; font-size: .84rem; text-align: center; padding: 8px 16px; border-bottom: 1px solid #fde8b0; }

/* ===== navbar ===== */
.navbar {
  position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between;
  padding: 12px max(24px, calc((100% - 1180px) / 2)); background: rgba(15, 27, 61, .92);
  backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255, 255, 255, .08); transition: box-shadow .3s;
}
.navbar.scrolled { box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font-weight: 600; font-size: 1.2rem; }
.logo b { color: var(--sun); }
.logo-mark { width: 38px; height: 38px; }
nav { display: flex; align-items: center; gap: 2px; }
nav a {
  color: #d6dcf5; text-decoration: none; font-size: .88rem; font-weight: 500; padding: 8px 12px;
  border-radius: 30px; transition: .2s; white-space: nowrap;
}
nav a:hover { color: #fff; background: rgba(255, 255, 255, .1); }
nav a.active { color: var(--navy); background: var(--sun); }
nav a.nav-phone { margin-left: 8px; background: var(--grad-sun); color: var(--navy); font-weight: 600; }
.menu-toggle { display: none; background: none; border: 0; color: #fff; font-size: 1.7rem; cursor: pointer; }

/* ===== buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer;
  padding: 13px 28px; border-radius: 50px; font-size: .98rem; font-weight: 600; text-decoration: none;
  transition: transform .2s, box-shadow .2s, filter .2s;
}
.btn:hover { transform: translateY(-3px); }
.btn:active { transform: translateY(0); }
.btn-sun { background: var(--grad-sun); color: var(--navy); box-shadow: 0 8px 22px rgba(249, 115, 98, .35); }
.btn-teal { background: var(--grad-teal); color: #fff; box-shadow: 0 8px 22px rgba(14, 165, 164, .35); }
.btn-outline { background: rgba(255, 255, 255, .08); color: #fff; border: 2px solid rgba(255, 255, 255, .45); }
.btn-white { background: #fff; color: var(--indigo); }
.btn-ghost-dark { background: transparent; color: var(--muted); border: 2px solid var(--line); }
.btn-ghost-dark:hover { border-color: var(--coral); color: var(--coral); }
.btn.small { padding: 9px 20px; font-size: .88rem; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .6; cursor: not-allowed; transform: none; }

/* ===== hero ===== */
.hero { position: relative; overflow: hidden; color: #fff; background: var(--grad-night); padding: 90px 0 120px; }
.hero-bg .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; animation: drift 12s ease-in-out infinite; }
.orb.o1 { width: 380px; height: 380px; background: var(--teal); top: -120px; left: -100px; }
.orb.o2 { width: 340px; height: 340px; background: var(--coral); bottom: -140px; right: 10%; animation-delay: -4s; }
.orb.o3 { width: 260px; height: 260px; background: var(--indigo); top: 20%; right: -80px; animation-delay: -8s; }
@keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -34px); } }

.hero-inner { position: relative; z-index: 2; width: min(1180px, 100% - 48px); margin-inline: auto; display: grid; grid-template-columns: 1.15fr .85fr; gap: 56px; align-items: center; }
.pill { display: inline-block; padding: 7px 18px; border-radius: 40px; font-size: .84rem; font-weight: 500; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .25); }
.hero h1 { font-family: var(--font-head); font-size: clamp(3rem, 7vw, 5.2rem); line-height: 1.05; font-weight: 800; margin: 20px 0 16px; letter-spacing: -.5px; }
.hero h1 em { font-style: normal; background: var(--grad-sun); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { font-size: 1.15rem; color: #dfe5ff; max-width: 540px; }
.hero-cta { display: flex; gap: 14px; flex-wrap: wrap; margin: 30px 0 28px; }
.trust-row { display: flex; gap: 22px; flex-wrap: wrap; font-size: .9rem; color: #cfd8ff; }

.hero-card {
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22); border-radius: 28px;
  padding: 30px; text-align: center; backdrop-filter: blur(16px); box-shadow: var(--shadow-lg);
  animation: bob 7s ease-in-out infinite;
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
.hc-eyebrow { font-size: .76rem; letter-spacing: 2px; text-transform: uppercase; color: #cbd5ff; }
.mini-ring { position: relative; width: 176px; height: 176px; margin: 16px auto; }
.mini-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.m-bg, .m-fg { fill: none; stroke-width: 9; }
.m-bg { stroke: rgba(255, 255, 255, .18); }
.m-fg { stroke: var(--sun); stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 98; }
.mini-ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.mini-ring-text strong { font-family: var(--font-head); font-size: 3rem; line-height: 1; }
.mini-ring-text span { font-size: .78rem; color: #cbd5ff; }
.hc-line { display: flex; justify-content: space-between; font-size: .84rem; margin-bottom: 8px; color: #dfe5ff; }
.hc-note { margin-top: 14px; font-weight: 500; }
.bar { height: 10px; background: rgba(120, 130, 170, .25); border-radius: 20px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 20px; background: var(--grad-sun); transition: width .8s ease; }
.bar.big { height: 14px; background: #e6eaf8; margin-top: 18px; }
.bar.big i { background: linear-gradient(90deg, var(--teal), var(--indigo), var(--rose)); }
.scroll-hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); color: #fff; text-decoration: none; font-size: 2rem; opacity: .7; animation: nudge 2s ease-in-out infinite; z-index: 2; }
@keyframes nudge { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }

/* ===== sections ===== */
.section { padding: 96px 0; }
.section.tight { padding: 70px 0 20px; }
.section.alt { background: #fff; }
.sec-head { text-align: center; max-width: 720px; margin: 0 auto 48px; }
.sec-head.left { text-align: left; margin: 0; max-width: none; }
.eyebrow { display: inline-block; font-size: .76rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--coral); margin-bottom: 8px; }
.sec-head h2 { font-family: var(--font-head); font-size: clamp(2rem, 4.2vw, 3rem); line-height: 1.15; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
.sec-head p { color: var(--muted); }
.sec-head .ticks { margin-top: 18px; }

/* ===== reveal animation (only when JS is on) ===== */
.js .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s ease; }
.js .reveal.in { opacity: 1; transform: none; }

/* ===== how it works ===== */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; counter-reset: s; }
.step { background: #fff; border-radius: var(--radius); padding: 26px 22px; box-shadow: var(--shadow); text-align: center; border-top: 5px solid var(--teal); transition: transform .3s; }
.step:nth-child(2) { border-color: var(--sun); }
.step:nth-child(3) { border-color: var(--coral); }
.step:nth-child(4) { border-color: var(--indigo); }
.step:hover { transform: translateY(-8px); }
.step-n { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--grad-night); color: #fff; font-weight: 700; margin-bottom: 10px; }
.step h3 { font-size: 1.1rem; margin-bottom: 4px; color: var(--navy); }
.step p { font-size: .9rem; color: var(--muted); }

/* ===== addictions explorer ===== */
.explorer-tools { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.explorer-tools.left { margin-bottom: 20px; }
.search-box { flex: 1 1 280px; }
input, select, textarea {
  width: 100%; padding: 13px 16px; border: 2px solid var(--line); border-radius: 14px; background: #fff;
  font: inherit; color: var(--ink); transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(67, 56, 202, .15); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: #fff; color: var(--muted); padding: 8px 18px; border-radius: 40px; font-weight: 500; font-size: .88rem; cursor: pointer; transition: .2s; }
.chip:hover { border-color: var(--indigo); color: var(--indigo); }
.chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }

.add-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
.add-card {
  position: relative; overflow: hidden; text-align: left; border: 0; cursor: pointer; color: #fff; padding: 24px;
  border-radius: var(--radius); box-shadow: var(--shadow); transition: transform .3s, box-shadow .3s; min-height: 190px;
}
.add-card::after { content: ""; position: absolute; width: 150px; height: 150px; right: -50px; top: -50px; border-radius: 50%; background: rgba(255, 255, 255, .16); }
.add-card:hover { transform: translateY(-8px) rotate(-.4deg); box-shadow: var(--shadow-lg); }
.add-card .ic { font-size: 2.3rem; position: relative; }
.add-card h3 { font-size: 1.1rem; margin: 8px 0 4px; position: relative; }
.add-card p { font-size: .88rem; opacity: .95; position: relative; }
.add-card .more { display: inline-block; margin-top: 12px; font-size: .82rem; font-weight: 600; position: relative; border-bottom: 2px solid rgba(255, 255, 255, .6); }
.empty { text-align: center; color: var(--muted); padding: 24px; grid-column: 1 / -1; }

/* modal */
.modal { margin: auto; border: 0; border-radius: 26px; width: min(680px, 94vw); padding: 0; box-shadow: var(--shadow-lg); color: var(--ink); max-height: 90vh; overflow: auto; }
.modal::backdrop { background: rgba(15, 27, 61, .65); backdrop-filter: blur(4px); }
.modal[open] { animation: pop .3s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } }
.modal-head { color: #fff; padding: 32px 32px 24px; }
.modal-head .ic { font-size: 2.6rem; }
.modal-head h3 { font-family: var(--font-head); font-size: 1.8rem; margin-top: 4px; }
.modal-main { padding: 26px 32px 32px; }
.modal-main h4 { color: var(--navy); margin: 18px 0 6px; font-size: 1rem; }
.modal-main h4:first-child { margin-top: 0; }
.modal-main p, .modal-main li { color: var(--muted); font-size: .94rem; }
.modal-main ul { list-style: disc; padding-left: 20px; }
.modal-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.modal-close { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .25); color: #fff; font-size: 1rem; cursor: pointer; }

/* ===== guide tabs ===== */
.guide { background: var(--bg); border-radius: 26px; padding: 12px; max-width: 900px; margin: 0 auto 40px; box-shadow: var(--shadow); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px; }
.tab { flex: 1 1 auto; border: 0; background: transparent; padding: 12px 18px; border-radius: 16px; font-weight: 600; font-size: .9rem; color: var(--muted); cursor: pointer; transition: .2s; }
.tab:hover { color: var(--navy); }
.tab.active { background: #fff; color: var(--indigo); box-shadow: var(--shadow); }
.tab-panel { display: none; padding: 26px 28px 30px; }
.tab-panel.active { display: block; animation: fadeUp .4s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
.tab-panel h3 { font-family: var(--font-head); font-size: 1.6rem; color: var(--navy); margin-bottom: 10px; }
.tab-panel p { color: var(--muted); margin-bottom: 10px; }
.ticks li { position: relative; padding-left: 30px; margin: 8px 0; color: var(--ink); }
.ticks li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; color: #fff; background: var(--teal); }
.format-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 8px; }
.format-grid div { background: #fff; border-radius: 16px; padding: 16px; border-left: 5px solid var(--sun); }
.format-grid div:nth-child(2) { border-color: var(--teal); }
.format-grid div:nth-child(3) { border-color: var(--coral); }
.format-grid div:nth-child(4) { border-color: var(--indigo); }
.format-grid p { font-size: .88rem; margin: 4px 0 0; }

/* quiz */
.quiz-card { max-width: 900px; margin: 0 auto; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-lg); background: #fff; border: 1px solid var(--line); }
.quiz-head { background: var(--grad-night); color: #fff; padding: 28px 32px; }
.quiz-head h3 { font-family: var(--font-head); font-size: 1.6rem; }
.quiz-head p { color: #cfd8ff; font-size: .92rem; }
.quiz-form { padding: 24px 32px 32px; }
.q-item { padding: 14px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 14px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.q-item p { flex: 1 1 340px; font-size: .95rem; }
.yn { display: flex; gap: 8px; }
.yn label { cursor: pointer; }
.yn input { position: absolute; opacity: 0; width: 0; }
.yn span { display: inline-block; min-width: 64px; text-align: center; padding: 8px 16px; border-radius: 30px; border: 2px solid var(--line); font-weight: 600; font-size: .86rem; transition: .2s; }
.yn input:checked + span { background: var(--navy); color: #fff; border-color: var(--navy); }
.yn input:focus-visible + span { outline: 3px solid var(--sun); }
.quiz-form .btn { margin-top: 22px; }
.quiz-result { margin: 0 32px 32px; padding: 24px; border-radius: 20px; }
.quiz-result h4 { font-family: var(--font-head); font-size: 1.4rem; margin-bottom: 6px; }
.quiz-result .btn { margin-top: 14px; }
.quiz-result.low { background: #ecfdf5; color: #065f46; }
.quiz-result.mid { background: #fffbeb; color: #78450a; }
.quiz-result.high { background: #fff1f0; color: #8a2a1e; }

/* ===== cards / forms ===== */
.card-box { background: #fff; border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card-box h3 { font-size: 1.15rem; color: var(--navy); margin-bottom: 10px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .88rem; color: var(--navy); }
.hint { font-size: .84rem; color: var(--muted); margin: 6px 0 12px; }
.check { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 400; color: var(--muted); }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--indigo); }
.inline-form { display: flex; gap: 10px; }
.inline-form input { flex: 1; }

/* ===== tracker ===== */
.tracker-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 26px; align-items: stretch; }
.display-box { display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #fff, #f3f0ff); }
.display-box > div { width: 100%; }
.tracker-empty { text-align: center; color: var(--muted); }
.big-emoji { font-size: 3.4rem; }
.t-label { text-align: center; font-weight: 600; color: var(--indigo); }
.ring-wrap { position: relative; width: 200px; height: 200px; margin: 14px auto; }
.ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg, .ring-fg { fill: none; stroke-width: 9; }
.ring-bg { stroke: #e6eaf8; }
.ring-fg { stroke: var(--coral); stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 326.7; transition: stroke-dashoffset 1s ease; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-center strong { font-family: var(--font-head); font-size: 3.4rem; line-height: 1; color: var(--navy); }
.ring-center span { font-size: .8rem; color: var(--muted); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
.stat-row div { background: #fff; border-radius: 16px; padding: 14px 6px; text-align: center; box-shadow: var(--shadow); }
.stat-row strong { display: block; font-size: 1.45rem; font-family: var(--font-head); }
.stat-row div:nth-child(1) strong { color: var(--coral); }
.stat-row div:nth-child(2) strong { color: var(--indigo); }
.stat-row div:nth-child(3) strong { color: var(--teal-d); }
.stat-row span { font-size: .76rem; color: var(--muted); }
.t-msg { text-align: center; margin-top: 14px; font-weight: 600; color: var(--navy); }
#relapseBtn { margin-top: 14px; width: 100%; }

.milestones { margin-top: 30px; }
.milestones h3 { margin-bottom: 14px; color: var(--navy); }
.badge-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 12px; }
.m-badge { background: #fff; border: 2px dashed var(--line); border-radius: 18px; padding: 14px 8px; text-align: center; color: #9aa3bd; transition: .4s; }
.m-badge .mi { font-size: 1.8rem; filter: grayscale(1); opacity: .5; }
.m-badge b { display: block; font-size: .9rem; }
.m-badge small { font-size: .74rem; }
.m-badge.got { border: 2px solid var(--sun); background: linear-gradient(160deg, #fffbeb, #fff); color: var(--navy); box-shadow: var(--shadow); }
.m-badge.got .mi { filter: none; opacity: 1; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }

.extras { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 30px; }
.extras .wide { grid-column: 1 / -1; }
.list li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 14px; margin-top: 8px; background: var(--bg); border-radius: 12px; font-size: .92rem; }
.x-btn { border: 0; background: none; color: #c0392b; cursor: pointer; font-weight: 700; }
.pledge-count { margin-top: 12px; font-size: .9rem; color: var(--muted); font-weight: 500; }
.mood-row { display: flex; gap: 8px; }
.mood-row label { flex-direction: row; cursor: pointer; }
.mood-row input { position: absolute; opacity: 0; width: 0; }
.mood-row span { font-size: 1.6rem; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; border: 2px solid var(--line); transition: .2s; }
.mood-row input:checked + span { border-color: var(--indigo); background: #eef2ff; transform: scale(1.1); }
.journal-list { margin-top: 16px; display: grid; gap: 10px; }
.journal-list li { background: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: .92rem; border-left: 5px solid var(--teal); }
.journal-list time { display: block; font-size: .74rem; color: var(--muted); }
.journal-list .x-btn { float: right; }

/* ===== counselors ===== */
.counselor-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 28px; align-items: start; }
.counselor-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.c-person { background: #fff; border-radius: var(--radius); padding: 24px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--line); border-top: 6px solid var(--teal); transition: .3s; }
.c-person:nth-child(3n+2) { border-top-color: var(--sun); }
.c-person:nth-child(3n+3) { border-top-color: var(--coral); }
.c-person:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.avatar { width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-head); font-size: 2rem; font-weight: 700; background: var(--grad-night); box-shadow: 0 8px 18px rgba(67, 56, 202, .3); }
.c-person h4 { color: var(--navy); }
.spec { display: inline-block; margin: 6px 0 8px; padding: 3px 14px; border-radius: 20px; font-size: .78rem; font-weight: 600; color: var(--teal-d); background: #d9f7f6; }
.c-person p { font-size: .88rem; color: var(--muted); }
.c-person small { color: var(--muted); display: block; margin-top: 4px; word-break: break-all; }
.c-actions { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.c-actions .remove { background: none; border: 0; color: #c0392b; cursor: pointer; font-weight: 600; font-size: .84rem; }

/* ===== chat ===== */
.chat-box { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-lg); border: 1px solid var(--line); }
.chat-locked { text-align: center; padding: 60px 24px; font-weight: 500; }
.chat-locked .lock { font-size: 3.2rem; }
.chat-top { display: flex; gap: 14px; flex-wrap: wrap; padding: 16px; background: var(--grad-teal); }
.chat-top label { flex: 1 1 200px; color: #fff; }
.chat-messages { height: 380px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(180deg, #f5f7ff, #fdf6f4); }
.msg { max-width: 76%; padding: 11px 18px; border-radius: 20px; font-size: .94rem; overflow-wrap: anywhere; }
.msg small { display: block; font-size: .7rem; opacity: .75; margin-bottom: 2px; }
.msg.patient { align-self: flex-end; color: #fff; background: var(--grad-night); border-bottom-right-radius: 5px; }
.msg.counselor { align-self: flex-start; background: #fff; border-bottom-left-radius: 5px; box-shadow: 0 3px 10px rgba(15, 27, 61, .08); }
.chat-input { display: flex; gap: 10px; padding: 16px; background: #fff; border-top: 1px solid var(--line); }
.chat-input input { flex: 1; }

/* ===== payment ===== */
.pay-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
.pay-card { position: relative; overflow: hidden; color: #fff; text-align: center; padding: 44px 36px; border-radius: 30px; background: var(--grad-night); box-shadow: var(--shadow-lg); }
.pay-card::before { content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(251, 191, 36, .5), transparent 70%); top: -100px; right: -80px; }
.pay-card > * { position: relative; }
.pay-eyebrow { font-size: .76rem; letter-spacing: 3px; text-transform: uppercase; color: #cbd5ff; }
.price { font-family: var(--font-head); font-size: 4.6rem; font-weight: 800; line-height: 1.1; }
.price small { font-family: var(--font-body); font-size: 1.2rem; font-weight: 600; margin-right: 6px; color: var(--sun); }
.price-sub { color: #cbd5ff; margin-bottom: 20px; }
.pay-card input { border-color: transparent; }
.pay-note { margin-top: 16px; font-weight: 600; }
.pay-note.dark { color: var(--teal-d); margin-top: 0; }
.pay-demo { display: block; margin-top: 10px; color: #aeb9e8; }

/* ===== FAQ ===== */
.faq details { background: #fff; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; }
.faq summary { cursor: pointer; padding: 18px 56px 18px 22px; font-weight: 600; color: var(--navy); list-style: none; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; position: absolute; right: 22px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-size: 1.2rem; color: var(--indigo); transition: .3s; }
.faq details[open] summary::after { content: "–"; background: var(--sun); color: var(--navy); }
.faq details p { padding: 0 22px 20px; color: var(--muted); }

/* ===== about & contact ===== */
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
.about-card { background: var(--bg); border-radius: var(--radius); padding: 32px 26px; text-align: center; box-shadow: var(--shadow); transition: .3s; }
.about-card:hover { transform: translateY(-8px); }
.ai { font-size: 2.6rem; margin-bottom: 6px; }
.about-card h3 { color: var(--navy); margin-bottom: 6px; }
.about-card p { color: var(--muted); font-size: .94rem; }

.contact-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.contact-cards { display: grid; gap: 18px; }
.c-card { display: flex; align-items: center; gap: 18px; color: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); transition: .3s; }
.c-card:hover { transform: translateX(8px); }
.c-card > span { font-size: 2.2rem; }
.c-card h3 { font-size: 1rem; }
.c-card p, .c-card a { color: #fff; font-weight: 500; overflow-wrap: anywhere; }
.c1 { background: var(--grad-teal); }
.c2 { background: var(--grad-sun); color: var(--navy); }
.c2 h3, .c2 p, .c2 a { color: var(--navy); }
.c3 { background: var(--grad-night); }

/* ===== footer ===== */
.footer { background: var(--navy); color: #b9c3ec; padding: 60px 0 24px; }
.foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr; gap: 36px; }
.foot-logo { font-size: 1.4rem; font-weight: 600; color: #fff; margin-bottom: 8px; }
.foot-logo b { color: var(--sun); }
.footer h4 { color: #fff; margin-bottom: 12px; }
.footer a:not(.btn) { display: block; color: #b9c3ec; text-decoration: none; padding: 3px 0; font-size: .92rem; }
.footer a:not(.btn):hover { color: var(--sun); }
.footer .btn { margin-top: 10px; }
.foot-base { border-top: 1px solid rgba(255, 255, 255, .1); margin-top: 40px; padding-top: 20px; font-size: .82rem; }

/* ===== misc ===== */
.to-top { position: fixed; right: 20px; bottom: 20px; z-index: 900; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--grad-sun); color: var(--navy); font-size: 1.3rem; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transform: translateY(14px); transition: .3s; }
.to-top.show { opacity: 1; pointer-events: auto; transform: none; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 4000; transform: translate(-50%, 30px); background: var(--navy); color: #fde68a; padding: 11px 22px; border-radius: 40px; font-size: .86rem; font-weight: 500; max-width: 92vw; text-align: center; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: .35s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== responsive ===== */
@media (max-width: 1100px) {
  .menu-toggle { display: block; }
  nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; padding: 14px 24px 22px; background: rgba(15, 27, 61, .98); }
  nav.open { display: flex; }
  nav a { padding: 12px 14px; }
  nav a.nav-phone { margin: 8px 0 0; text-align: center; }
}
@media (max-width: 900px) {
  .hero-inner, .tracker-grid, .counselor-layout, .pay-wrap, .contact-layout { grid-template-columns: 1fr; }
  .hero { padding: 60px 0 100px; }
  .hero-card { max-width: 360px; margin-inline: auto; }
  .steps { grid-template-columns: repeat(2, 1fr); }
  .extras { grid-template-columns: 1fr; }
  .foot-grid { grid-template-columns: 1fr 1fr; }
  .section { padding: 72px 0; }
}
@media (max-width: 560px) {
  .steps { grid-template-columns: 1fr; }
  .foot-grid { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: 1fr; }
  .quiz-form, .modal-main { padding-inline: 20px; }
  .quiz-result { margin-inline: 20px; }
  .tab { flex: 1 1 45%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .js .reveal { opacity: 1; transform: none; }
}


/* ==========================================================
   Multi-page additions
   ========================================================== */
body { animation: pageIn .5s ease; transition: opacity .17s; }
body.leaving { opacity: 0; }
@keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }

/* ----- dropdown menus ----- */
.dd { position: relative; }
.dd-btn { background: none; border: 0; cursor: pointer; color: #d6dcf5; font: inherit; font-size: .88rem; font-weight: 500; padding: 8px 12px; border-radius: 30px; transition: .2s; white-space: nowrap; }
.dd-btn::after { content: " ▾"; font-size: .75em; }
.dd-btn:hover, .dd.open .dd-btn { color: #fff; background: rgba(255, 255, 255, .1); }
.dd-btn.active { color: var(--navy); background: var(--sun); }
.dd-menu { position: absolute; top: 100%; left: 0; min-width: 210px; display: none; flex-direction: column; gap: 2px; background: #16224d; border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px; padding: 8px; box-shadow: var(--shadow-lg); z-index: 1100; }
.dd:hover .dd-menu, .dd.open .dd-menu, .dd:focus-within .dd-menu { display: flex; }
.dd-menu a { border-radius: 10px; }

/* ----- inner page banner ----- */
.page-hero { position: relative; overflow: hidden; color: #fff; background: var(--grad-night); padding: 60px 0 68px; }
.page-hero::before { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%; right: -90px; top: -150px; background: radial-gradient(circle, rgba(251, 191, 36, .45), transparent 70%); }
.page-hero::after { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; left: -100px; bottom: -170px; background: radial-gradient(circle, rgba(14, 165, 164, .5), transparent 70%); }
.page-hero .wrap { position: relative; z-index: 2; }
.page-hero h1 { font-family: var(--font-head); font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.1; margin: 10px 0; }
.page-hero p { color: #dfe5ff; max-width: 640px; }
.crumbs { font-size: .84rem; color: #b9c3ec; }
.crumbs a { color: #fff; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }

/* ----- home: feature tiles, stats, cta ----- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
.tile { position: relative; overflow: hidden; display: block; min-height: 200px; padding: 28px; border-radius: var(--radius); color: #fff; text-decoration: none; box-shadow: var(--shadow); transition: transform .3s, box-shadow .3s; }
.tile::after { content: ""; position: absolute; width: 170px; height: 170px; border-radius: 50%; right: -60px; top: -60px; background: rgba(255, 255, 255, .15); }
.tile:hover { transform: translateY(-8px) scale(1.02); box-shadow: var(--shadow-lg); }
.tile .t-ic { font-size: 2.5rem; position: relative; }
.tile h3 { margin: 8px 0 6px; font-size: 1.2rem; position: relative; }
.tile p { font-size: .9rem; opacity: .95; position: relative; max-width: 90%; }
.tile .go { position: absolute; right: 22px; bottom: 16px; font-size: 1.5rem; transition: transform .3s; }
.tile:hover .go { transform: translateX(8px); }

.stats-band { background: var(--navy); color: #fff; padding: 56px 0; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
.stat-box strong { display: block; font-family: var(--font-head); font-size: 3.2rem; color: var(--sun); line-height: 1.1; }
.stat-box span { color: #b9c3ec; font-size: .92rem; }

.cta-band { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 22px; padding: 38px 40px; border-radius: 28px; color: #fff; background: var(--grad-night); box-shadow: var(--shadow-lg); }
.cta-band h2 { font-family: var(--font-head); font-size: 1.9rem; }
.cta-band p { color: #cfd8ff; }

/* ----- book library ----- */
.books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 28px; }
.book-card { background: none; border: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; transition: transform .3s; }
.book-card:hover { transform: translateY(-10px) rotate(-1deg); }
.cover { position: relative; aspect-ratio: 2 / 3; border-radius: 6px 14px 14px 6px; color: #fff; padding: 18px 16px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; box-shadow: var(--shadow-lg), inset 9px 0 0 rgba(0, 0, 0, .18); }
.cover::after { content: ""; position: absolute; width: 150px; height: 150px; border-radius: 50%; right: -50px; top: -50px; background: rgba(255, 255, 255, .14); }
.cover b { position: relative; font-family: var(--font-head); font-size: 1.05rem; line-height: 1.2; }
.cover i { position: relative; font-style: normal; font-size: .78rem; opacity: .9; margin-top: 6px; }
.cover-n { position: absolute; top: 12px; left: 18px; font-family: var(--font-head); font-size: 1.7rem; opacity: .5; z-index: 1; }
.cover.big { width: 170px; flex: none; }
.book-info { padding: 14px 4px 0; }
.book-info h3 { font-size: 1rem; color: var(--navy); line-height: 1.3; }
.book-info .by { font-size: .82rem; color: var(--muted); }
.book-info .pg { font-size: .82rem; font-weight: 600; color: var(--teal-d); margin-top: 2px; }
.note-box { max-width: 820px; margin: 0 auto 32px; background: #fff7e6; color: #7c4a03; border-radius: 16px; padding: 14px 20px; font-size: .9rem; }
.book-detail { display: flex; gap: 24px; padding: 30px 30px 8px; flex-wrap: wrap; }
.book-detail > div:last-child { flex: 1; min-width: 220px; }
.book-detail h3 { font-family: var(--font-head); font-size: 1.7rem; color: var(--navy); line-height: 1.2; }
.book-detail .by { color: var(--muted); font-size: .9rem; margin-bottom: 4px; }
.book-detail p { margin-bottom: 8px; font-size: .94rem; }
.plan-box { margin: 10px 30px 30px; padding: 20px; background: var(--bg); border-radius: 20px; }
.plan-box h4 { color: var(--navy); margin-bottom: 8px; }
.plan-box label { font-weight: 500; }
input[type=range] { padding: 0; height: 28px; accent-color: var(--indigo); border: 0; background: none; box-shadow: none; }
.calc { margin: 12px 0 6px; font-weight: 600; color: var(--indigo); }
.sched { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
.sched b { color: var(--navy); margin-right: 6px; }
.modal-close.dark { background: var(--bg); color: var(--ink); z-index: 3; }

/* ----- tracker: reading gate ----- */
.rule-banner { background: linear-gradient(90deg, #ecfeff, #f5f3ff); border: 1px solid #d6e4ff; border-radius: 18px; padding: 16px 22px; margin-bottom: 26px; color: var(--navy); font-size: .94rem; }
.read-setup { background: var(--bg); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.read-setup h4 { color: var(--navy); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.link-small { font-size: .84rem; font-weight: 600; text-decoration: none; }
.reading-card { margin-top: 26px; border-top: 6px solid var(--teal); }
.read-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.read-head > div:nth-child(2) { flex: 1; min-width: 200px; }
.read-head h3 { margin: 0; }
.book-mini { width: 56px; height: 76px; flex: none; border-radius: 6px 10px 10px 6px; color: #fff; display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; box-shadow: var(--shadow); }
.eyebrow-s { font-size: .74rem; letter-spacing: 2px; text-transform: uppercase; color: var(--coral); font-weight: 700; }
.chip-status { padding: 7px 16px; border-radius: 30px; font-size: .84rem; font-weight: 600; }
.chip-status.ok { background: #dcfce7; color: #166534; }
.chip-status.lock { background: #fff7e6; color: #9a5b00; }
.chip-status.warn { background: #fee2e2; color: #991b1b; }
#readForm { margin-top: 16px; padding-top: 16px; border-top: 2px dashed var(--line); }
.read-assign { background: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: .94rem; }
.word-meter { height: 8px; background: #e6eaf8; border-radius: 8px; overflow: hidden; }
.word-meter i { display: block; height: 100%; width: 0; background: var(--grad-teal); transition: width .3s; }
.info-ok { margin-top: 14px; background: #ecfdf5; color: #065f46; border-radius: 14px; padding: 14px 18px; }
#nextBookBox { margin-top: 18px; padding: 18px; border-radius: 18px; background: #fff7e6; }
#nextBookBox h4 { color: #7c4a03; margin-bottom: 8px; }

/* ----- pricing ----- */
.pay-layout { display: grid; grid-template-columns: 1.4fr .8fr; gap: 28px; align-items: start; }
.pm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.pm { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 10px; background: #fff; border: 2px solid var(--line); border-radius: 18px; cursor: pointer; transition: .2s; font: inherit; }
.pm:hover { border-color: var(--indigo); transform: translateY(-3px); }
.pm.active { border-color: var(--indigo); background: #eef2ff; box-shadow: 0 0 0 4px rgba(67, 56, 202, .15); }
.pm-ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.1rem; }
.pm-name { font-weight: 600; font-size: .88rem; color: var(--navy); }
.pm-price { font-size: .76rem; color: var(--muted); }
.pay-panel { margin-top: 22px; padding-top: 22px; border-top: 2px dashed var(--line); min-height: 120px; }
.pay-panel h3 { margin-bottom: 4px; }
.field-err { color: #c0392b; font-size: .86rem; min-height: 1.2em; }
.wallet-btn { width: 100%; padding: 15px; font-size: 1.05rem; color: #fff; border-radius: 50px; }
.wallet-btn.paypal { background: #1d4ed8; }
.wallet-btn.paypal i { color: #7dd3fc; margin-left: 1px; }
.wallet-btn.googlepay { background: #111827; }
.bank-box { display: grid; gap: 8px; background: var(--bg); border-radius: 14px; padding: 16px; }
.bank-box div { display: flex; justify-content: space-between; gap: 10px; }
.bank-box span { color: var(--muted); font-size: .86rem; }
.summary { position: sticky; top: 100px; text-align: left; }
.summary h3 { font-family: var(--font-head); font-size: 1.6rem; margin: 6px 0 14px; }
.sum-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px dashed rgba(255, 255, 255, .25); }
.sum-row.total { font-size: 1.2rem; border-bottom: 0; color: var(--sun); }
.summary .ticks { margin-top: 14px; }
.summary .ticks li { color: #fff; }
.pay-done { text-align: center; padding: 14px 6px; }
.pay-done h3 { font-family: var(--font-head); font-size: 1.6rem; }
.pay-done .btn { margin-top: 14px; }
.pay-banner { background: #ecfdf5; color: #065f46; border-radius: 16px; padding: 14px 18px; margin-bottom: 22px; font-weight: 500; }
.spin { width: 16px; height: 16px; border: 3px solid rgba(15, 27, 61, .25); border-top-color: var(--navy); border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ----- about ----- */
.rule-list { counter-reset: r; display: grid; gap: 14px; max-width: 820px; margin: 36px auto 0; }
.rule-list li { counter-increment: r; position: relative; background: var(--bg); border-radius: 18px; padding: 18px 20px 18px 66px; }
.rule-list li::before { content: counter(r); position: absolute; left: 18px; top: 16px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; background: var(--grad-night); }

/* ----- chat page ----- */
.chat-locked a { font-weight: 600; }

/* ----- confetti ----- */
.confetti { position: fixed; inset: 0; z-index: 5000; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -16px; width: 9px; height: 14px; border-radius: 2px; animation: fall 2s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .8; } }

@media (max-width: 1100px) {
  .dd-btn { text-align: left; padding: 12px 14px; }
  .dd-btn::after { content: ""; }
  .dd-menu, .dd:hover .dd-menu { position: static; display: flex; background: transparent; border: 0; box-shadow: none; padding: 0 0 0 14px; }
}
@media (max-width: 900px) {
  .pay-layout { grid-template-columns: 1fr; }
  .summary { position: static; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .page-hero { padding: 44px 0 52px; }
  .cta-band { padding: 28px 24px; }
}
@media (max-width: 560px) {
  .two { grid-template-columns: 1fr; }
  .book-detail { padding: 24px 20px 6px; }
  .plan-box { margin: 10px 20px 24px; }
  .books-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
}

/* ==========================================================
   Single-page views, Handbooks, Meetings
   ========================================================== */
.view { display: none; }
.view.active { display: block; animation: viewIn .4s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
nav#navLinks a, .dd-btn { font-size: .85rem; }
@media (min-width: 1101px) { nav#navLinks { gap: 0; } nav#navLinks > a, .dd-btn { padding: 8px 10px; } }

/* ----- handbooks ----- */
.hb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; margin-top: 8px; }
.hb-card { position: relative; overflow: hidden; text-align: left; border: 0; cursor: pointer; font: inherit; color: #fff; padding: 28px 24px 24px; min-height: 250px; border-radius: var(--radius); background: var(--g); box-shadow: var(--shadow); transition: transform .3s, box-shadow .3s; display: flex; flex-direction: column; gap: 8px; }
.hb-card::after { content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%; right: -70px; top: -70px; background: rgba(255, 255, 255, .15); }
.hb-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
.hb-ic { font-size: 2.4rem; position: relative; }
.hb-card h3 { font-family: var(--font-head); font-size: 1.35rem; line-height: 1.2; position: relative; }
.hb-card p { font-size: .9rem; opacity: .95; position: relative; flex: 1; }
.hb-meta { font-size: .78rem; font-weight: 600; background: rgba(0, 0, 0, .22); border-radius: 30px; padding: 5px 12px; align-self: flex-start; position: relative; }
.hb-reader { padding: 32px 32px 8px; max-width: 760px; }
.hb-reader h2 { font-family: var(--font-head); font-size: 1.9rem; color: var(--navy); line-height: 1.2; margin-bottom: 4px; }
.hb-reader .by { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
.hb-toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
.hb-toc button { border: 1px solid var(--line); background: #fff; border-radius: 30px; padding: 6px 14px; font: inherit; font-size: .8rem; cursor: pointer; color: var(--navy); }
.hb-toc button:hover { background: var(--bg); }
.hb-ch { margin-bottom: 20px; }
.hb-ch h3 { color: var(--indigo); font-size: 1.15rem; margin-bottom: 6px; }
.hb-ch p { margin-bottom: 8px; font-size: .95rem; }
.hb-ch ul { margin: 6px 0 8px 20px; display: grid; gap: 4px; font-size: .95rem; }
.hb-warn { background: #fff7e6; color: #7c4a03; border-radius: 14px; padding: 12px 16px; font-size: .9rem; margin-bottom: 12px; }
.hb-actions { position: sticky; bottom: 0; display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 32px 20px; background: linear-gradient(transparent, #fff 30%); }

/* ----- meetings ----- */
.next-up { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 28px; border-radius: 24px; color: #fff; background: var(--grad-night); box-shadow: var(--shadow-lg); margin-bottom: 26px; }
.next-up small { color: var(--sun); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.next-up h3 { font-family: var(--font-head); font-size: 1.5rem; margin: 4px 0; }
.next-up p { color: #cfd8ff; }
.count-chip { font-family: var(--font-head); font-size: 1.5rem; color: var(--sun); }
.meet-list { display: grid; gap: 16px; margin-top: 8px; }
.meet-card { display: grid; grid-template-columns: 96px 1fr auto; gap: 20px; align-items: center; background: #fff; border-radius: 22px; padding: 20px 22px; box-shadow: var(--shadow); border-left: 6px solid var(--c, var(--indigo)); }
.meet-day { text-align: center; background: var(--bg); border-radius: 16px; padding: 12px 6px; }
.meet-day b { display: block; font-size: 1.25rem; color: var(--navy); font-family: var(--font-head); }
.meet-day span { font-size: .78rem; color: var(--muted); }
.meet-card h3 { color: var(--navy); font-size: 1.1rem; margin-bottom: 2px; }
.meet-card p { font-size: .88rem; color: var(--muted); }
.meet-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: .78rem; }
.meet-meta span { background: var(--bg); border-radius: 30px; padding: 4px 12px; color: var(--navy); font-weight: 500; }
.meet-meta .soon { background: #fee2e2; color: #991b1b; font-weight: 700; }
.meet-act { display: grid; gap: 8px; min-width: 150px; }
.btn.going { background: #dcfce7; color: #166534; box-shadow: none; }
@media (max-width: 760px) {
  .meet-card { grid-template-columns: 1fr; }
  .meet-day { display: flex; gap: 10px; align-items: baseline; justify-content: flex-start; padding: 10px 14px; }
  .hb-reader { padding: 24px 20px 8px; }
  .hb-actions { padding: 12px 20px 18px; }
}
@media print {
  .navbar, .crisis-bar, .footer, .to-top, .scroll-progress { display: none !important; }
}
</style>
<style>
.adm{max-width:1150px;margin:0 auto;padding:28px 16px 60px}.adm h1{font-family:var(--font-head);color:var(--navy)}
.adm-login{max-width:380px;margin:80px auto;display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:20px 0}
.kpi{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow)}.kpi b{display:block;font-size:1.9rem;color:var(--indigo)}
.tw{overflow-x:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow);margin:10px 0 28px}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg);color:var(--navy)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div class="adm">
 <div id="login" class="adm-login card-box"><h1>Admin</h1><p class="hint">Enter your admin token.</p>
  <input type="password" id="tok" placeholder="Admin token"><button class="btn btn-sun" id="go">Open dashboard</button><p class="field-err" id="err"></p></div>
 <div id="dash" class="hidden">
  <div class="row"><h1>Client dashboard</h1><button class="btn btn-ghost-dark small" id="refresh">Refresh</button><button class="btn btn-ghost-dark small" id="out">Log out</button></div>
  <div class="kpis" id="kpis"></div>
  <div class="row"><h2>Clients</h2><button class="btn btn-teal small" data-csv="clients">Download CSV</button></div>
  <div class="tw"><table id="tClients"></table></div>
  <div class="row"><h2>Call-back requests</h2><button class="btn btn-teal small" data-csv="callbacks">Download CSV</button></div>
  <div class="tw"><table id="tCalls"></table></div>
  <h2>Counselors on the platform</h2>
  <form id="fC" class="card-box stack" style="margin:10px 0 14px"><input id="cN" placeholder="Full name" required><input id="cS" placeholder="Specialty e.g. Alcohol, Pornography" required><input id="cE" type="email" placeholder="Email (optional)"><textarea id="cB" rows="2" placeholder="Short bio"></textarea><button class="btn btn-sun small" type="submit">Add counselor</button><p class="field-err" id="eC"></p></form>
  <div class="tw"><table id="tCouns"></table></div>
  <h2>Meetings</h2>
  <p class="hint">Visitors only see meetings you add here. Times are East Africa Time (EAT).</p>
  <form id="fM" class="card-box stack" style="margin:10px 0 14px"><input id="mT" placeholder="Meeting title" required>
   <div class="two"><select id="mCat"><option value="general">General</option><option value="checkin">Daily check-in</option><option value="substances">Substances</option><option value="digital">Digital</option><option value="family">Family</option><option value="newcomers">Newcomers</option></select>
   <select id="mDow"><option value="daily">Every day</option><option value="0">Every Sunday</option><option value="1">Every Monday</option><option value="2">Every Tuesday</option><option value="3">Every Wednesday</option><option value="4">Every Thursday</option><option value="5">Every Friday</option><option value="6">Every Saturday</option></select></div>
   <div class="two"><input id="mTime" type="time" value="19:00" required><input id="mMins" type="number" min="5" max="300" value="60" required></div>
   <input id="mHost" placeholder="Host e.g. Counselor Jane"><input id="mLink" type="url" placeholder="Join link (optional) https://..."><textarea id="mDesc" rows="2" placeholder="Short description"></textarea>
   <button class="btn btn-sun small" type="submit">Add meeting</button><p class="field-err" id="eM"></p></form>
  <div class="tw"><table id="tMeet"></table></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);let DATA=null;
const fmt=t=>t?new Date(t*1000).toLocaleString():"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function table(el,cols,rows){el.innerHTML="<tr>"+cols.map(c=>"<th>"+c[0]+"</th>").join("")+"</tr>"+(rows.length?rows.map(r=>"<tr>"+cols.map(c=>"<td>"+esc(c[1](r))+"</td>").join("")+"</tr>").join(""):"<tr><td colspan="+cols.length+">Nothing yet.</td></tr>");}
const CL=[["Client",r=>r.client],["Paid",r=>r.paid?"Yes ("+r.method+")":"No"],["Phone",r=>r.phone],["Quitting",r=>r.addiction],["Goal days",r=>r.goal],["Started",r=>fmt(r.start_ts)],["Readings done",r=>r.readings],["Messages",r=>r.messages],["Meeting RSVPs",r=>r.rsvps],["Last active",r=>fmt(r.last_active)]];
const CB=[["Name",r=>r.name],["Phone",r=>r.phone],["Best time",r=>r.best_time],["Message",r=>r.message],["Received",r=>fmt(r.created)]];
async function load(){const t=sessionStorage.getItem("adm");if(!t)return;
 const r=await fetch("/api/admin/summary",{headers:{"X-Admin-Token":t}});
 if(!r.ok){sessionStorage.removeItem("adm");$("err").textContent=r.status===503?"Admin is disabled: set ADMIN_TOKEN on the server.":"Wrong token.";$("login").classList.remove("hidden");$("dash").classList.add("hidden");return;}
 DATA=await r.json();$("login").classList.add("hidden");$("dash").classList.remove("hidden");
 const k=DATA.totals;$("kpis").innerHTML=[["Clients",k.clients],["Paid clients",k.paid],["Revenue (KES)",k.revenue_kes],["Active trackers",k.trackers],["Readings checked in",k.readings],["Call-back requests",k.callbacks],["Meeting RSVPs",k.rsvps]].map(x=>'<div class="kpi"><b>'+x[1]+"</b>"+x[0]+"</div>").join("");
 table($("tClients"),CL,DATA.clients);table($("tCalls"),CB,DATA.callbacks);loadLists();}
$("go").onclick=()=>{sessionStorage.setItem("adm",$("tok").value.trim());$("err").textContent="";load();};
$("refresh").onclick=load;$("out").onclick=()=>{sessionStorage.removeItem("adm");location.reload();};
document.querySelectorAll("[data-csv]").forEach(b=>b.onclick=()=>{const w=b.dataset.csv,cols=w==="clients"?CL:CB,rows=w==="clients"?DATA.clients:DATA.callbacks;
 const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const csv=[cols.map(c=>q(c[0])).join(",")].concat(rows.map(r=>cols.map(c=>q(c[1](r))).join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=w+".csv";a.click();});
const AH=()=>({"Content-Type":"application/json","X-Admin-Token":sessionStorage.getItem("adm")});
const DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function listTable(el,head,rows,delAttr){el.innerHTML="<tr>"+head.map(h=>"<th>"+h+"</th>").join("")+"<th></th></tr>"+(rows.length?rows.map(r=>"<tr>"+r.cells.map(c=>"<td>"+esc(c)+"</td>").join("")+'<td><button class="btn btn-ghost-dark small" '+delAttr+'="'+r.id+'">Remove</button></td></tr>').join(""):"<tr><td colspan="+(head.length+1)+">Nothing yet.</td></tr>");}
async function loadLists(){
 const [c,m]=await Promise.all([fetch("/api/counselors").then(r=>r.json()),fetch("/api/meetings").then(r=>r.json())]);
 listTable($("tCouns"),["Name","Specialty","Email"],c.map(x=>({id:x.id,cells:[x.name,x.specialty,x.email]})),"data-dc");
 listTable($("tMeet"),["Title","When (EAT)","Minutes","Host","Link"],m.map(x=>({id:x.id,cells:[x.title,(x.daily?"Every day":"Every "+DN[x.dow])+" "+x.time,x.mins,x.host,x.link]})),"data-dm");}
async function send(url,method,body,err){const r=await fetch(url,{method,headers:AH(),body:body?JSON.stringify(body):undefined});
 if(!r.ok){let m="Failed";try{m=(await r.json()).error||m}catch(e){}$(err).textContent=m;return false}$(err).textContent="";return true;}
$("fC").onsubmit=async e=>{e.preventDefault();if(await send("/api/admin/counselors","POST",{name:$("cN").value,specialty:$("cS").value,email:$("cE").value,bio:$("cB").value},"eC")){e.target.reset();load();}};
$("fM").onsubmit=async e=>{e.preventDefault();const d=$("mDow").value;
 if(await send("/api/admin/meetings","POST",{title:$("mT").value,cat:$("mCat").value,daily:d==="daily",dow:d==="daily"?null:Number(d),time:$("mTime").value,mins:Number($("mMins").value),host:$("mHost").value,link:$("mLink").value,desc:$("mDesc").value},"eM")){e.target.reset();$("mTime").value="19:00";$("mMins").value=60;load();}};
document.addEventListener("click",async e=>{const c=e.target.closest("[data-dc]"),m=e.target.closest("[data-dm]");
 if(c&&confirm("Remove this counselor and their chats?")){await send("/api/admin/counselors/"+c.dataset.dc,"DELETE",null,"eC");loadLists();}
 if(m&&confirm("Remove this meeting?")){await send("/api/admin/meetings/"+m.dataset.dm,"DELETE",null,"eM");loadLists();}});
load();
</script></body></html>
